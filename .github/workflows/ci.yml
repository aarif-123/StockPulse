name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend CI (Lint, Typecheck, Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Prisma Client Generation
        run: npx prisma generate

      - name: Run Linter (ESLint)
        run: npm run lint

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run Test Suite (Jest)
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://mock:mock@localhost:5432/mock_db
          JWT_SECRET: test_jwt_secret_key_at_least_32_characters_long
          GROQ_API_KEY: gsk_mock_test_key_for_testing

  frontend-ci:
    name: Frontend CI (Lint, Typecheck, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (oxlint)
        run: npm run lint

      - name: Run Production Build
        run: npm run build
